<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLESS PRAISE Portal - San Vicente NHS</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
  // Look and feel follows the CKSS Client Portal: dark sidebar, white top bar, light workspace, one blue accent.
  // "brand" is the ink scale and "depedGold" the accent, so existing classes pick up the theme.
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { 50: '#fcfcfb', 100: '#f0efec', 200: '#e1e0d9', 500: '#6f6d68', 600: '#52514e', 800: '#1a202b', 900: '#12161c', 950: '#0b0b0b' },
          depedGold: { 400: '#5598e7', 500: '#1c5cab', 600: '#174d8f' },
          cream: '#f6f6f4'
        },
        fontFamily: {
          sans: ['system-ui', '-apple-system', '"Segoe UI"', 'Roboto', 'sans-serif'],
          serif: ['system-ui', '-apple-system', '"Segoe UI"', 'Roboto', 'sans-serif'],
          mono: ['ui-monospace', '"Cascadia Code"', 'Consolas', 'monospace']
        }
      }
    }
  }
</script>
<style>
  :root { --accent: #1c5cab; --ease-out: cubic-bezier(0.22, 1, 0.36, 1); }
  body { overflow-x: clip; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #c3c2b7; border-radius: 9999px; }
  .tabular { font-variant-numeric: tabular-nums; }
  .ld-kicker { display: block; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }

  /* Shell: sidebar + top bar, hidden while signed out */
  .signed-out #sidebar, .signed-out #topbar, .signed-out #footer { display: none; }
  .signed-out #main { max-width: none; padding: 0; }
  .signed-out #shell { display: block; }
  #sidebar .nav-btn { color: #c9ced6; }
  #sidebar .nav-btn:hover { background: rgba(255, 255, 255, 0.06); }
  #sidebar .nav-btn.active { background: rgba(255, 255, 255, 0.10); color: #fff; }

  /* Page change: content rises in, staggered. */
  @keyframes ldIn { from { opacity: 0; transform: translateY(14px) scale(0.99); } to { opacity: 1; transform: none; } }
  .ld-enter > *, .ld-enter > * > .grid > * { animation: ldIn .7s var(--ease-out) both; }
  .ld-enter > :nth-child(2) { animation-delay: .06s; } .ld-enter > :nth-child(3) { animation-delay: .12s; }
  .ld-enter > :nth-child(4) { animation-delay: .18s; } .ld-enter > :nth-child(n+5) { animation-delay: .24s; }
  .ld-enter > * > .grid > :nth-child(2) { animation-delay: .08s; } .ld-enter > * > .grid > :nth-child(3) { animation-delay: .14s; }
  .ld-enter > * > .grid > :nth-child(4) { animation-delay: .2s; } .ld-enter > * > .grid > :nth-child(n+5) { animation-delay: .26s; }
  @keyframes navIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
  .nav-enter .nav-btn { animation: navIn .6s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 45ms + 120ms); }

  /* Scroll reveals */
  [data-reveal] { opacity: 0; transform: translateY(22px); transition: opacity .7s ease, transform .9s var(--ease-out); }
  [data-reveal].is-in { opacity: 1; transform: none; }
  [data-reveal].no-anim { transition: none; }

  /* Sign-in: always dark, network animation behind */
  .ld-hero { background: radial-gradient(1100px 700px at 75% 20%, #0f1a2b 0%, transparent 60%), #07090d; }
  .ld-hero::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(7, 9, 13, 0.7) 0%, rgba(7, 9, 13, 0.15) 45%, rgba(7, 9, 13, 0.55) 100%); }
  @media (max-width: 1023px) { .ld-hero::after { background: linear-gradient(180deg, rgba(7, 9, 13, 0.35) 0%, rgba(7, 9, 13, 0.75) 100%); } }
  .ld-grad { background: linear-gradient(92deg, #2bd47a, #5598e7); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ld-word { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: 0.08em; }
  .ld-word > span { display: inline-block; animation: ldRise 1s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 180ms + 250ms); }
  @keyframes ldRise { from { transform: translateY(110%); } to { transform: none; } }
  .ld-played .ld-word > span, .ld-played .ld-fade { animation: none; }
  .ld-fade { animation: ldIn .9s var(--ease-out) both; animation-delay: var(--d, .9s); }
  .ld-auth input, .ld-auth select { background-color: rgba(7, 9, 13, 0.6); border-color: rgba(255, 255, 255, 0.18); color: #e9eef6; }
  .ld-auth select option { background: #11151d; }
  .ld-auth label, .ld-auth .text-slate-700 { color: #e9eef6; }
  .ld-auth .text-slate-500, .ld-auth .text-slate-600 { color: #8b94a4; }
  .ld-auth .text-depedGold-500 { color: #5598e7; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    [data-reveal] { opacity: 1; transform: none; }
  }
  @media print { .no-print, #sidebar, #topbar { display: none !important; } body { background: white !important; } }
</style>
</head>
<body class="signed-out bg-cream text-brand-950 font-sans antialiased">

<div id="shell" class="min-h-screen lg:grid lg:grid-cols-[232px_minmax(0,1fr)]">
  <aside id="sidebar" class="no-print bg-brand-900 text-[#c9ced6] lg:sticky lg:top-0 lg:h-screen flex flex-wrap lg:flex-nowrap lg:flex-col items-center lg:items-stretch gap-2 lg:gap-5 px-4 lg:px-3 py-3 lg:py-5 lg:overflow-y-auto"></aside>

  <div class="min-w-0 flex flex-col min-h-screen">
    <div id="topbar" class="no-print flex items-center justify-end gap-3 px-4 sm:px-7 py-3 bg-brand-50 border-b border-black/10">
      <div id="userbox" class="flex flex-wrap items-center justify-end gap-2.5 text-sm"></div>
    </div>

    <main id="main" class="w-full max-w-[1280px] px-4 sm:px-7 pt-6 pb-12 flex-1">
      <div class="py-24 text-center text-slate-400 text-sm">Loading…</div>
    </main>

    <footer id="footer" class="no-print border-t border-black/10 px-4 sm:px-7 py-4 text-brand-500 text-xs flex flex-wrap items-center justify-between gap-2">
      <span>San Vicente NHS · SDO Panabo City · Region XI</span>
      <span><strong class="text-brand-950">B</strong>uilding <strong class="text-brand-950">L</strong>eadership, <strong class="text-brand-950">E</strong>xcellence &amp; <strong class="text-brand-950">S</strong>teadfast <strong class="text-brand-950">S</strong>ervice</span>
    </footer>
  </div>
</div>

<div id="modal" data-lenis-prevent class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm"></div>

<div id="toast" class="fixed bottom-5 right-5 z-50 translate-y-20 opacity-0 transition-all duration-300 pointer-events-none bg-brand-950 text-white text-sm px-4 py-3 rounded-lg shadow-xl flex items-center gap-2">
  <span id="toast-dot" class="w-2 h-2 rounded-full bg-emerald-400"></span>
  <span id="toast-message"></span>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
